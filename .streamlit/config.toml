# Thème de l'application — aligné sur la palette définie dans core.py.
# Sans ce fichier, un poste configuré en thème sombre afficherait des widgets
# sombres autour de graphiques clairs.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f7f6f3"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
