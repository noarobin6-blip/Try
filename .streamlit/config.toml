# Thème des widgets Streamlit — aligné sur le thème « institutionnel » de
# core.py, qui est celui du produit. Le sélecteur d'apparence de l'application
# repeint ensuite les surfaces en CSS pour les thèmes sombre et clair.
[theme]
base = "light"
primaryColor = "#16314f"
backgroundColor = "#f5f5f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#111823"
font = "sans serif"

[browser]
gatherUsageStats = false
