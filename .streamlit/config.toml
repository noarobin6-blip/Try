# Thème de l'application — aligné sur la palette « sombre » de core.py.
# Sans ce fichier, les widgets Streamlit resteraient clairs autour de
# graphiques sombres.
[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d1014"
secondaryBackgroundColor = "#14181e"
textColor = "#eef2f6"
font = "sans serif"

[browser]
gatherUsageStats = false
